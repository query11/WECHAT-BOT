name: Windows offline verification

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  offline:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install QR dependency
        run: python -m pip install -r requirements.txt
      - name: Parse Windows PowerShell scripts
        shell: powershell
        run: ./tools/check_powershell.ps1
      - name: Run offline regression
        env:
          # Windows hosted runners may expose TEMP/TMP through an 8.3 user alias.
          # The runner context is available after the job has been assigned.
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          PYTHONIOENCODING: utf-8
        run: python tools/verify.py --suite offline --label github-actions
      - name: Run process isolation outside runner job
        if: ${{ !cancelled() }}
        shell: powershell
        run: ./tools/run_windows_integration.ps1
      - name: Check WinForms layouts
        if: ${{ !cancelled() }}
        shell: powershell
        env:
          PYTHONIOENCODING: utf-8
        run: |
          # Isolated CI-only example configuration lets the real memory window open.
          if (Test-Path config.json) { throw 'UI verification requires a pristine checkout' }
          Copy-Item config.example.json config.json
          Copy-Item BOT_MEMORY.example.md BOT_MEMORY.md
          & powershell -NoProfile -STA -ExecutionPolicy Bypass -File desktop/tray_app.ps1 -VerifyUX
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & powershell -NoProfile -STA -ExecutionPolicy Bypass -File desktop/tray_app.ps1 -VerifyWindows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-verification
          path: .runtime/
          include-hidden-files: true
          if-no-files-found: warn
