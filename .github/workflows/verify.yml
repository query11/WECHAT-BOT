name: Windows offline verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install QR dependency
        run: python -m pip install -r requirements.txt
      - name: Run offline regression
        env:
          # Windows hosted runners may expose TEMP/TMP through an 8.3 user alias.
          # The runner context is available after the job has been assigned.
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          PYTHONIOENCODING: utf-8
        run: python tools/verify.py --suite offline --label github-actions
      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-verification
          path: .runtime/verification/github-actions/
          if-no-files-found: warn
