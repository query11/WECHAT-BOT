name: Windows offline verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      # Windows hosted runners may expose TEMP/TMP through an 8.3 user alias.
      # Use the full runner path for fixtures that reject redirected paths.
      TEMP: ${{ runner.temp }}
      TMP: ${{ runner.temp }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install QR dependency
        run: python -m pip install -r requirements.txt
      - name: Run offline regression
        run: python tools/verify.py --suite offline --label github-actions
      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-verification
          path: .runtime/verification/github-actions/
          if-no-files-found: warn
