name: Release

# Push a tag such as v1.2.0 (matching the VERSION file) to publish a release.
# The assets are what updater.py downloads and verifies:
#   WECHAT-BOT-<version>.zip  tracked files of the tag (git archive applies .gitattributes)
#   SHA256SUMS.txt            checksum of that zip
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check that VERSION matches the tag
        run: |
          version="$(tr -d '\r\n' < VERSION)"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::VERSION says ${version}, but the tag is ${GITHUB_REF_NAME}"
            exit 1
          fi
      - name: Build the archive and checksum
        run: |
          version="$(tr -d '\r\n' < VERSION)"
          name="WECHAT-BOT-${version}"
          git archive --format=zip --prefix="${name}/" -o "${name}.zip" "${GITHUB_REF_NAME}"
          sha256sum "${name}.zip" > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Publish or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(tr -d '\r\n' < VERSION)"
          files=("WECHAT-BOT-${version}.zip" SHA256SUMS.txt)
          if gh release view "${GITHUB_REF_NAME}" > /dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "${files[@]}" --clobber
          else
            flags=(--title "WECHAT-BOT ${GITHUB_REF_NAME}" --generate-notes --verify-tag)
            case "${version}" in *-*) flags+=(--prerelease) ;; esac
            gh release create "${GITHUB_REF_NAME}" "${files[@]}" "${flags[@]}"
          fi
