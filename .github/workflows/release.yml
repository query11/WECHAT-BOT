name: Release

on:
  push:
    tags: ['v*']
    branches: [main, 'claude/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verification:
    uses: ./.github/workflows/verify.yml
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Archive committed source
        run: |
          version="$(tr -d '\r\n' < VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          mkdir dist
          git archive --format=zip --prefix="WECHAT-BOT-${version}/" -o "dist/WECHAT-BOT-${version}.zip" HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: source-package
          path: dist/*.zip
          if-no-files-found: error
  installer:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - name: Install Inno Setup with official Simplified Chinese
        shell: powershell
        run: |
          choco install innosetup -y --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $compiler = Get-ChildItem -Path "${env:ProgramFiles(x86)}\Inno Setup*\ISCC.exe", "$env:ProgramFiles\Inno Setup*\ISCC.exe" -ErrorAction SilentlyContinue | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $compiler -or -not (Test-Path (Join-Path $compiler.DirectoryName 'Languages\ChineseSimplified.isl'))) { throw 'Inno Setup 7.0.2+ with official Chinese translation required' }
          "INNO_ISCC=$($compiler.FullName)" >> $env:GITHUB_ENV
      - name: Parse PowerShell
        shell: powershell
        run: ./tools/check_powershell.ps1
      - name: Build bundled installer
        shell: powershell
        run: ./installer/build.ps1 -ISCC $env:INNO_ISCC
      - name: Install, upgrade and uninstall
        shell: powershell
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          PYTHONIOENCODING: utf-8
        run: ./installer/smoke.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/*.exe
          if-no-files-found: error
      - name: Upload build and smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installer-evidence
          path: |
            dist/build-info.json
            .runtime/installer-smoke/
          include-hidden-files: true
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [verification, package, installer]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: source-package
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: dist
      - name: Check tag and produce both checksums
        run: |
          version="$(tr -d '\r\n' < VERSION)"
          test "v${version}" = "${GITHUB_REF_NAME}"
          cd dist
          sha256sum "WECHAT-BOT-${version}.zip" "WeChatAssistant-Setup-${version}.exe" > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
      - name: Publish verified assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(tr -d '\r\n' < VERSION)"
          gh release create "${GITHUB_REF_NAME}" "dist/WECHAT-BOT-${version}.zip" "dist/WeChatAssistant-Setup-${version}.exe" dist/SHA256SUMS.txt --verify-tag --title "微信助手 ${GITHUB_REF_NAME}" --generate-notes --notes-file installer/RELEASE_NOTES.md
